name: FloorPlanTracer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  FloorPlanTracer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.floorplantracer
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: FloorPlanTracer
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "Camera access is required for AR preview and scanning."
        NSPhotoLibraryAddUsageDescription: "Save renders and exports to Photos."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
